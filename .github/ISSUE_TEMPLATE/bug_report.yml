name: 🐛 Bug 报告
description: 报告配额看板的错误行为或数据问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。**请勿在 issue 中粘贴任何 token、API Key 或完整账号信息**——日志请先脱敏。

  - type: dropdown
    id: provider
    attributes:
      label: 受影响的 Provider
      description: 问题发生在哪个数据路径上？
      multiple: true
      options:
        - Codex（codex_chatgpt）
        - GLM Coding Plan（glm_coding_plan）
        - Kimi Code（kimi_code）
        - 聚合 API / 共享层
        - UI / 前端
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望行为是什么？
      placeholder: |
        实际：…
        期望：…
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 配置 …
        2. 运行 npm run dev
        3. 打开首页 / 调用 /api/v1/quota
        4. 看到 …
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 日志 / 响应 / 截图
      description: 相关的 API 响应、控制台输出或截图（务必脱敏）
      render: text

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      placeholder: |
        - OS: macOS 15.x
        - Node: v22.x
        - 相关 CLI 版本（codex / kimi CLI）: …
        - 数据源：official_protocol / official_compatibility / local_estimate
    validations:
      required: true
